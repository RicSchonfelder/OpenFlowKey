name: "Test Package"
description: "Installs the built package and verifies the installed binaries can run"

inputs:
  like:
    description: "Used only on linux distro type: debian, fedora, suse, arch"
    required: false
    default: ""

runs:
  using: "composite"

  steps:
    - name: Test package
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "macOS" ]; then
          dmg=$(ls build/openflowkey-*.dmg | head -1)
          echo "Y" | hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/openflowkey-dmg
          /tmp/openflowkey-dmg/OpenFlowKey.app/Contents/MacOS/openflowkey-core --version
          hdiutil detach /tmp/openflowkey-dmg

        elif [ "$RUNNER_OS" == "Windows" ]; then
          7z x build/openflowkey-*-portable.7z -otmp/openflowkey-pkg
          exe=$(find tmp/openflowkey-pkg -name "openflowkey-core.exe" -type f | head -1)
          exe_dir=$(dirname "$exe")
          pkg_root=$(dirname "$exe_dir")
          export PATH="$exe_dir:$pkg_root:$pkg_root/lib:$PATH"
          "$exe" --version

        elif [ "$RUNNER_OS" == "Linux" ]; then
          if [ "${{inputs.like}}" == "debian" ]; then
            apt-get install -y ./build/openflowkey-*.deb
          elif [ "${{inputs.like}}" == "fedora" ]; then
            dnf install -y build/openflowkey-*.rpm
          elif [ "${{inputs.like}}" == "suse" ]; then
            zypper install -y --allow-unsigned-rpm build/openflowkey-*.rpm
          elif [ "${{inputs.like}}" == "arch" ]; then
            pacman -U --noconfirm build/openflowkey-*.pkg.tar.zst
          else
            echo "Unknown like: ${{inputs.like}}"
            exit 1
          fi
          QT_QPA_PLATFORM=minimal openflowkey-core --version

        else
          echo "Unknown OS: $RUNNER_OS"
          exit 1
        fi
