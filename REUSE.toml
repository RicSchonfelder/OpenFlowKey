version = 1
SPDX-PackageName = "openflowkey"
SPDX-PackageSupplier = "OpenFlowKey Devs"
SPDX-PackageDownloadLocation = "https://github.com/openflowkey/openflowkey"

[[annotations]]
path = [
   ".github/**"
 , ".clang-format"
 , ".editorconfig"
 , ".gitattributes"
 , ".gitignore"
 , "cspell.json"
 , "sonar-project.properties"
 , "cmake/vcpkg.json.in"
 , "**/*.md"
 , "docs/**"
  , "deploy/linux/flatpak/**"
  , "deploy/windows/wix-patch.xml.in"
  , "src/apps/openflowkey-core/openflowkey-core.exe.manifest"
  , "src/apps/res/manpage.txt"
 , "src/apps/res/openflowkey.plist.in"
 , "src/apps/res/entitlements-dev.plist"
 , "translations/*.ts"
]
SPDX-FileCopyrightText = "OpenFlowKey Developers"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
   "deploy/mac/dmg-background.tiff"
 , "deploy/mac/dmg-volume.icns"
 , "deploy/linux/org.openflowkey.openflowkey.png"
 , "deploy/windows/wix-banner.png"
 , "deploy/windows/wix-dialog.png"
 , "src/apps/res/icons/openflowkey-**/apps/64/*.svg"
 , "src/apps/res/image/welcome.png"
 , "src/apps/res/OpenFlowKey.icns"
 , "src/apps/res/openflowkey.ico"
 , "src/apps/res/openflowkey.qrc"
]
SPDX-FileCopyrightText = "OpenFlowKey Developers"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = "src/apps/res/icons/openflowkey-**/**/**/**.svg"
SPDX-FileCopyrightText = "Kde Breeze Icons"
SPDX-License-Identifier = "LGPL-2.1-only"

[[annotations]]
path = "src/apps/res/icons/openflowkey-**/index.theme"
SPDX-FileCopyrightText = "Chris Rizzitello <sithlord48@gmail.com>"
SPDX-License-Identifier = "LGPL-2.1-only"

[[annotations]]
path = [
   "src/lib/gui/MainWindow.ui"
 , "src/lib/gui/dialogs/*.ui"
]
SPDX-FileCopyrightText = "OpenFlowKey Developers"
SPDX-License-Identifier = "GPL-2.0-only WITH LicenseRef-OpenSSL-Exception"
